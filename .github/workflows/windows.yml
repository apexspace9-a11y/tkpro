name: LightBill Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main, lightbill]
    paths:
      - 'lightbill/windows/**'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: lightbill/windows
        run: npm install --no-audit --no-fund
      - name: Build Windows packages
        working-directory: lightbill/windows
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: LightBill-Windows-EXE
          path: lightbill/windows/dist/*.exe
          if-no-files-found: error
