name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, v4-upgrade ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tkpro-debug-keystore-v2
      - name: Create stable debug signing key
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Tiết Kiệm Pro V2,O=TKPro,C=VN" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reassemble legacy UI source
        run: cat app/src/main/java/vn/tietkiem/pro/ui/AppRoot.part.* > app/src/main/java/vn/tietkiem/pro/ui/AppRoot.kt
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: V4-build-log
          path: build.log
          archive: false
          if-no-files-found: error
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: TietKiemPro-V4.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
