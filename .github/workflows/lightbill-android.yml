name: LightBill Android APK
on:
  workflow_dispatch:
  push:
    branches: [lightbill]
    paths:
      - 'lightbill-source.b64.*'
      - 'LightBill-source.sha256'
      - '.github/workflows/lightbill-android.yml'
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore LightBill source
        shell: bash
        run: |
          cat \
            lightbill-source.b64.00 \
            lightbill-source.b64.01 \
            lightbill-source.b64.02 \
            lightbill-source.b64.03a \
            lightbill-source.b64.03b1 \
            lightbill-source.b64.03b2a \
            lightbill-source.b64.03b2b \
            lightbill-source.b64.04a1a \
            lightbill-source.b64.04a1b \
            lightbill-source.b64.04a2a \
            lightbill-source.b64.04a2b \
            lightbill-source.b64.04b1a \
            lightbill-source.b64.04b1b \
            lightbill-source.b64.04b2a \
            lightbill-source.b64.04b2b1 \
            lightbill-source.b64.04b2b2 \
            lightbill-source.b64.05 \
            lightbill-source.b64.06 | base64 --decode > LightBill-source.zip
          sha256sum -c LightBill-source.sha256
          unzip -q LightBill-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build sandbox APK
        working-directory: lightbill/android
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp lightbill/android/app/build/outputs/apk/debug/app-debug.apk LightBill-sandbox.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LightBill-Android-APK
          path: LightBill-sandbox.apk
          if-no-files-found: error
