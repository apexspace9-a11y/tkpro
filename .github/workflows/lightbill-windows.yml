name: LightBill Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [lightbill]
    paths:
      - 'lightbill-source.b64.*'
      - 'LightBill-source.sha256'
      - '.github/workflows/lightbill-windows.yml'
permissions:
  contents: read
jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore LightBill source
        shell: pwsh
        run: |
          $parts = @(
            'lightbill-source.b64.00',
            'lightbill-source.b64.01',
            'lightbill-source.b64.02',
            'lightbill-source.b64.03a',
            'lightbill-source.b64.03b1',
            'lightbill-source.b64.03b2a',
            'lightbill-source.b64.03b2b',
            'lightbill-source.b64.04a1a',
            'lightbill-source.b64.04a1b',
            'lightbill-source.b64.04a2a',
            'lightbill-source.b64.04a2b',
            'lightbill-source.b64.04b1a',
            'lightbill-source.b64.04b1b',
            'lightbill-source.b64.04b2a',
            'lightbill-source.b64.04b2b1',
            'lightbill-source.b64.04b2b2',
            'lightbill-source.b64.05',
            'lightbill-source.b64.06'
          )
          $encoded = ($parts | ForEach-Object { Get-Content $_ -Raw }) -join ''
          [IO.File]::WriteAllBytes('LightBill-source.zip', [Convert]::FromBase64String($encoded))
          $expected = (Get-Content 'LightBill-source.sha256' -Raw).Split(' ')[0].Trim()
          $actual = (Get-FileHash 'LightBill-source.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Source checksum mismatch" }
          Expand-Archive -Path 'LightBill-source.zip' -DestinationPath '.' -Force
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: lightbill/windows
        run: npm install --no-audit --no-fund
      - name: Build Windows packages
        working-directory: lightbill/windows
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: LightBill-Windows-EXE
          path: lightbill/windows/dist/*.exe
          if-no-files-found: error
