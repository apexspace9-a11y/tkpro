name: Publish LightBill 2 Clean Tree
on:
  push:
    branches: [lightbill]
    paths:
      - 'lbv2part-*'
      - '.github/workflows/publish-lightbill-v2.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and verify
        shell: bash
        run: |
          cat lbv2part-* | base64 --decode > /tmp/LightBill-2.0.0-source.zip
          echo "14ba5dccad0053fa43657185636245c16974626105163b793a1dc30c3ed24e45  /tmp/LightBill-2.0.0-source.zip" | sha256sum -c -
          mkdir -p /tmp/lightbill-v2
          unzip -q /tmp/LightBill-2.0.0-source.zip -d /tmp/lightbill-v2
      - name: Replace repository tree
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/lightbill-v2/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "LightBill 2.0: clean repo, ZaloPay, one-click install, MISA eInvoice"
          git push origin HEAD:lightbill
