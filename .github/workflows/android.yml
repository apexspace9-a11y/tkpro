name: LightBill Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, lightbill]
    paths:
      - 'lightbill/android/**'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: lightbill/android
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp lightbill/android/app/build/outputs/apk/debug/app-debug.apk LightBill-2.0.0-sandbox.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LightBill-Android-APK
          path: LightBill-2.0.0-sandbox.apk
          if-no-files-found: error
